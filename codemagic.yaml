workflows:
  ios:
    name: iOS build (kreator)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      node: 22
      xcode: latest
    scripts:
      - name: Paketi i web build
        script: |
          cd "$APP_DIR"
          npm ci || npm install
          if ! npm run build; then
            echo "Paketi sa Windowsa ne odgovaraju Macu, instaliram ponovo"
            rm -rf node_modules package-lock.json
            npm install
            npm run build
          fi
          npx cap sync ios
      - name: Keychain
        script: keychain initialize
      - name: Sertifikat i profil
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Potpisivanje projekta
        script: |
          keychain add-certificates
          cd "$APP_DIR/ios/App"
          xcode-project use-profiles
      - name: Broj builda
        script: |
          cd "$APP_DIR/ios/App"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $((BUILD_NUMBER + 100));/g" App.xcodeproj/project.pbxproj
      - name: Build IPA
        script: |
          cd "$APP_DIR/ios/App"
          xcode-project build-ipa --project App.xcodeproj --scheme App
      - name: Slanje u App Store Connect
        script: |
          IPA=$(find "$APP_DIR/ios/App/build/ios/ipa" -name "*.ipa" | head -1)
          app-store-connect publish --path "$IPA"
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
